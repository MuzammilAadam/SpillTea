
server:
  port: 8080

spring:
  application:
    name: spilltea-backend

  datasource:
    url: "jdbc:mysql://localhost:3306/spilltea_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: root
    password: "mysql@2005"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:SpillTeaSuperSecretKey2026SecureRandomKeyForJWT}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    dir: uploads

  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
